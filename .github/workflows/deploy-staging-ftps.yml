name: Deploy staging via FTPS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-ftps
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      VITE_BASE_PATH: /
      FTPS_HOST: ${{ secrets.FTPS_HOST }}
      FTPS_PORT: ${{ secrets.FTPS_PORT }}
      FTPS_USERNAME: ${{ secrets.FTPS_USERNAME }}
      FTPS_PASSWORD: ${{ secrets.FTPS_PASSWORD }}
      FTPS_STAGING_DIR: ${{ secrets.FTPS_STAGING_DIR }}
      STAGING_URL: ${{ secrets.STAGING_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate deployment settings
        shell: bash
        run: |
          set -euo pipefail
          for name in FTPS_HOST FTPS_PORT FTPS_USERNAME FTPS_PASSWORD FTPS_STAGING_DIR STAGING_URL; do
            test -n "${!name:-}" || { echo "Missing staging secret: $name"; exit 1; }
          done
          [[ "$FTPS_PORT" =~ ^[0-9]+$ ]] || { echo "FTPS_PORT must be numeric"; exit 1; }
          [[ "$FTPS_STAGING_DIR" == /* ]] || { echo "FTPS_STAGING_DIR must be an absolute remote path"; exit 1; }
          [[ "$STAGING_URL" == https://* ]] || { echo "STAGING_URL must use HTTPS"; exit 1; }

      - name: Install FTPS client
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends lftp

      - name: Upload build to staging over explicit FTPS
        shell: bash
        run: |
          set -euo pipefail
          lftp <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set ftp:ssl-auth TLS
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname true
          open --user "$FTPS_USERNAME","$FTPS_PASSWORD" --port "$FTPS_PORT" "ftp://$FTPS_HOST"
          mkdir -p "$FTPS_STAGING_DIR"
          mirror --reverse --verbose --only-newer --parallel=2 "dist/" "$FTPS_STAGING_DIR/"
          bye
          LFTP

      - name: Smoke test staging
        shell: bash
        run: curl --fail --silent --show-error --location --retry 3 --max-time 30 "$STAGING_URL" > /dev/null
